name: Catálogo Mistral

# Atualiza mistral.json toda segunda de manhã, ou quando alguém clica em "Run workflow".
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commits-no-site
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: node scripts/catalogo-mistral.mjs
      - name: Salvar se mudou
        run: |
          git config user.name "robô do catálogo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mistral.json
          git diff --cached --quiet -- mistral.json || { git commit -m "Atualiza catálogo da Mistral"; git pull --rebase; git push; }
