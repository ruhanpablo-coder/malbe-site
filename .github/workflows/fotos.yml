name: Fotos dos vinhos

# Quando o painel publica produtos.json com fotos de outro site, baixa as fotos para img/.
on:
  push:
    branches: [main]
    paths: [produtos.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commits-no-site
  cancel-in-progress: false

jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: node scripts/baixar-fotos.mjs
      - name: Salvar se mudou
        run: |
          git config user.name "robô das fotos"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img produtos.json
          git diff --cached --quiet || { git commit -m "Baixa fotos dos vinhos novos"; git pull --rebase; git push; }
